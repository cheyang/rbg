# Webhook configurations for the PR #509 deprecation verification harness.
#
# Verbatim copy of config/webhook/manifests.yaml (PR head), split into one
# document per file for envtest. envtest's WebhookInstallOptions rewrites each
# webhook clientConfig to the local serving host/port and injects its CA bundle;
# the service name/namespace placeholders below are never used.
---
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-rolebasedgroup
  failurePolicy: Fail
  name: mrolebasedgroup.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  failurePolicy: Fail
  name: mrolebasedgroupset.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-roleinstanceset
  failurePolicy: Fail
  name: mroleinstanceset.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - roleinstancesets
  sideEffects: None
