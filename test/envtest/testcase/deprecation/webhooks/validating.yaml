# Webhook configurations for the PR #509 deprecation verification harness.
#
# Verbatim copy of config/webhook/manifests.yaml (PR head), split into one
# document per file for envtest. envtest's WebhookInstallOptions rewrites each
# webhook clientConfig to the local serving host/port and injects its CA bundle;
# the service name/namespace placeholders below are never used.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-coordinatedpolicy
  failurePolicy: Fail
  name: vcoordinatedpolicy.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - coordinatedpolicies
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-rolebasedgroup
  failurePolicy: Fail
  name: vrolebasedgroup.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  failurePolicy: Fail
  name: vrolebasedgroupset.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-clusterengineruntimeprofile
  failurePolicy: Fail
  matchPolicy: Exact
  name: vclusterengineruntimeprofile-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - clusterengineruntimeprofiles
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-instance
  failurePolicy: Fail
  matchPolicy: Exact
  name: vinstance-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - instances
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-instanceset
  failurePolicy: Fail
  matchPolicy: Exact
  name: vinstanceset-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - instancesets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroup
  failurePolicy: Fail
  matchPolicy: Exact
  name: vrolebasedgroup-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroupscalingadapter
  failurePolicy: Fail
  matchPolicy: Exact
  name: vrolebasedgroupscalingadapter-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroupscalingadapters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha1-rolebasedgroupset
  failurePolicy: Fail
  matchPolicy: Exact
  name: vrolebasedgroupset-v1alpha1-deprecation.kb.io
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - rolebasedgroupsets
  sideEffects: None
