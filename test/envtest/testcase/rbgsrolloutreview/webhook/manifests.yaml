# Webhook configurations for the PR #474 review harness (Reviewer B / Codex).
# Mutating + validating webhooks for RoleBasedGroupSet only; envtest rewrites the
# caBundle/clientConfig to the local test server. Not for real deployments.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: rbgs-review-mutating
webhooks:
- name: mrolebasedgroupset.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: rbgs-review-validating
webhooks:
- name: vrolebasedgroupset.kb.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-workloads-x-k8s-io-v1alpha2-rolebasedgroupset
  rules:
  - apiGroups:
    - workloads.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - rolebasedgroupsets
