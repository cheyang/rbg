apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: pr439-f2-identity
  labels:
    app: pr439-f2-identity
spec:
  roles:
  - name: worker
    replicas: 2
    podManagementPolicy: Parallel
    workload: workloads.x-k8s.io/v1alpha2/RoleInstanceSet
    leaderWorkerPattern:
      size: 1
      template:
        metadata:
          labels:
            app: pr439-f2-identity
        spec:
          containers:
          - name: nginx
            image: nginx:1.25-alpine
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
