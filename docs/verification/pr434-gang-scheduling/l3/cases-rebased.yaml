apiVersion: v1
kind: Namespace
metadata:
  name: v434-verify
---
# BASELINE — well-formed per-role minimum. Expect minMember=2, pods Running.
apiVersion: workloads.x-k8s.io/v1alpha2
kind: CoordinatedPolicy
metadata:
  name: baseline-ok
  namespace: v434-verify
spec:
  policies:
    - name: gang
      roles: ["prefill"]
      strategy:
        scheduling:
          gang:
            minReplicas:
              prefill: 2
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: baseline-ok
  namespace: v434-verify
spec:
  roles:
    - name: prefill
      replicas: 2
      standalonePattern:
        template:
          spec:
            containers:
              - name: app
                image: registry.cn-hangzhou.aliyuncs.com/acs/pause:3.9
                resources:
                  requests: { cpu: 10m, memory: 16Mi }
---
