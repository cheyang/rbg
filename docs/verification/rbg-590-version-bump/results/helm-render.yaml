# Source: rbgs/templates/crd-upgrade/crd-upgrade.yaml
apiVersion: batch/v1
kind: Job
metadata:
  namespace: default
  name: rbgs-crds-upgrade-090-1fc69f70
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
