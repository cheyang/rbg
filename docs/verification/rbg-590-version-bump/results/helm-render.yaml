# Source: rbgs/templates/manager/manager.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbgs-controller-manager
  namespace: default
  labels:
    control-plane: rbgs-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: rbgs-controller
  template:
    metadata:
      labels:
        control-plane: rbgs-controller
    spec:
      serviceAccountName: rbgs-controller-sa
      securityContext:
        {}
      containers:
        - name: rbgs
          args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --max-concurrent-reconciles=10
            - --kube-api-qps=20
            - --kube-api-burst=30
            - --scheduler-name=scheduler-plugins
            - --enable-deprecated-workload-types=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /manager
          securityContext:
            {}
          image: "rolebasedgroup/rbgs-controller:v0.9.0-1fc69f70"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
