kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rbgs
    control-plane: rbgs-controller
  name: rbgs-controller-manager
  namespace: rbgs-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rbgs
      control-plane: rbgs-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbgs
        control-plane: rbgs-controller
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: rolebasedgroup/rbgs-controller:v0.9.0-73e05db4
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sleep
              - "5"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: rbgs
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1536Mi
          requests:
            cpu: 100m
            memory: 256Mi
      serviceAccountName: rbgs-controller-sa
      terminationGracePeriodSeconds: 35
---
apiVersion: admissionregistration.k8s.io/v1
