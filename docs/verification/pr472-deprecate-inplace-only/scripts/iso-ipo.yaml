apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata: {name: iso-ipo, namespace: pr472-verify}
spec:
  roles:
    - name: r
      replicas: 2
      rolloutStrategy:
        type: RollingUpdate
        rollingUpdate: {type: InPlaceOnly, maxUnavailable: 1, maxSurge: 0}
      standalonePattern:
        template:
          metadata: {labels: {appVersion: v1}}
          spec:
            containers:
              - name: nginx
                image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
                ports: [{containerPort: 80}]
